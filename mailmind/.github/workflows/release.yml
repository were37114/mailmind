name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA_ARGS="--bundles app"; fi
          npm run tauri build -- --target ${{ matrix.rust-target }} $EXTRA_ARGS
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MailMind ${{ github.ref_name }}'
          body: |
            ## MailMind ${{ github.ref_name }}

            AI驱动的企业邮件智能助手

            ### 下载安装
            - **Windows**: `MailMind_x64-setup.exe`
            - **Linux**: `.deb` / `.AppImage` / `.rpm`
            - **macOS**: `MailMind.app` (解压后拖入 /Applications)
          draft: false
          prerelease: true
          files: |
            artifacts/ubuntu-latest-bundle/**/*.deb
            artifacts/ubuntu-latest-bundle/**/*.AppImage
            artifacts/ubuntu-latest-bundle/**/*.rpm
            artifacts/macos-latest-bundle/**/*.tar.gz
            artifacts/windows-latest-bundle/**/*.exe
            artifacts/windows-latest-bundle/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
