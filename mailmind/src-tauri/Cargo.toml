[package]
name = "mailmind"
version = "0.1.0"
description = "MailMind - AI邮件第二大脑"
authors = ["MailMind Team"]
edition = "2021"

[lib]
name = "mailmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2.4.1"
mailparse = "0.16.1"

