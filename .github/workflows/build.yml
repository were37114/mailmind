name: 'Build MailMind'

on:
  push:
    branches:
      - feat/mailmind-mvp
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  # 1. 运行测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mailmind/package-lock.json

      - name: Install dependencies
        working-directory: mailmind
        run: npm ci

      - name: Run type check
        working-directory: mailmind
        run: npm run typecheck

      - name: Run lint
        working-directory: mailmind
        run: npm run lint

      - name: Run tests
        working-directory: mailmind
        run: npm run test

  # 2. 构建 Windows 安装包
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mailmind/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: mailmind
        run: npm ci

      - name: Build frontend
        working-directory: mailmind
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mailmind
          args: '--target x86_64-pc-windows-msvc'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            mailmind/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            mailmind/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  # 3. 构建 macOS 安装包
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mailmind/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: mailmind
        run: npm ci

      - name: Build frontend
        working-directory: mailmind
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mailmind
          args: '--target aarch64-apple-darwin'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            mailmind/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            mailmind/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  # 4. 构建 Linux 安装包
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mailmind/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: mailmind
        run: npm ci

      - name: Build frontend
        working-directory: mailmind
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mailmind

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            mailmind/src-tauri/target/release/bundle/deb/*.deb
            mailmind/src-tauri/target/release/bundle/rpm/*.rpm
            mailmind/src-tauri/target/release/bundle/appimage/*.AppImage

  # 5. 发布 Release
  publish-release:
    needs: [build-windows, build-macos, build-linux]
    if: github.ref == 'refs/heads/feat/mailmind-mvp' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.1.0-mvp
          files: artifacts/**
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
